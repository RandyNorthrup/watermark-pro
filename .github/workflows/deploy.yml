name: Deploy

# Production deploys happen from version tags only (v1.0.0, v1.0.1, …). The
# quality, generated-source, end-to-end and pinned Semgrep gates run on the
# tagged commit. The production job requires all of them. Migrations are applied
# to the production D1 database before the Worker that needs them ships.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts, D1, R2 and Email edit rights
#   CLOUDFLARE_ACCOUNT_ID  the account that owns watermark-pro
# Authentication/provider/Turnstile credentials are Worker secrets managed with
# `wrangler secret put … --env production` (see docs/runbook.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gates:
    name: Quality, SAST and all devices on the tag
    # Same commit, quality/SAST prerequisites, four independent device runners
    # and fail-closed aggregate as branch CI. No deployment secrets are passed.
    uses: ./.github/workflows/ci.yml

  ui:
    name: Complete UI audit matrix on the tag
    needs: gates
    uses: ./.github/workflows/audit-ui.yml

  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    needs: [gates, ui]
    environment:
      name: production
      url: https://lumafoil.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-gitleaks
        with:
          install-browsers: 'false'
      - name: Build, migrate, deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: npm run deploy
      - name: Smoke-check the deployment
        run: |
          curl --fail --silent --show-error https://lumafoil.com/api/health \
            | grep -q '"status":"ok"'
