name: Deploy

# Production deploys happen from version tags only (v1.0.0, v1.0.1, …). The
# quality and end-to-end gates run first on the tagged commit; the Worker is
# never uploaded from a tree that has not passed them. Migrations are applied
# to the production D1 database before the Worker that needs them ships.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts, D1, R2 and Email edit rights
#   CLOUDFLARE_ACCOUNT_ID  the account that owns watermark-pro
# BETTER_AUTH_SECRET and the Turnstile keys are Worker secrets set once with
# `wrangler secret put … --env production` (see docs/runbook.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gates:
    name: Quality gates on the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-gitleaks
      - run: npm run quality:ci
      - run: npx playwright install --with-deps chromium
      # The preview Worker validates its configuration like production does,
      # so it needs a session secret. A random one per run is never committed
      # and never leaves the runner.
      - name: Provide a throwaway local secret for the preview Worker
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48)" > .dev.vars
      - run: npm run test:e2e

  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    needs: gates
    environment:
      name: production
      url: https://watermark.blowmoney.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build, migrate, deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: npm run deploy
      - name: Smoke-check the deployment
        run: |
          curl --fail --silent --show-error https://watermark.blowmoney.net/api/health \
            | grep -q '"status":"ok"'
