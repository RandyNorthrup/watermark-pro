name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, so it needs more than the default shallow clone.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-gitleaks

      # Regenerates worker-configuration.d.ts and fails if the committed file
      # is stale, so wrangler.jsonc and the types can never drift apart.
      - name: Verify generated Worker types are current
        run: |
          npm run cf-typegen
          git diff --exit-code -- worker-configuration.d.ts

      - name: Format, lint, types, dead code, cycles, duplication, secrets, audit, tests, build
        run: npm run quality:ci

      # The router plugin rewrites the route tree during the build above; the
      # committed copy must match so a fresh checkout lints and type-checks.
      - name: Verify the committed route tree is current
        run: git diff --exit-code -- src/client/routeTree.gen.ts

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-gitleaks
      # The preview Worker validates its configuration like production does,
      # so it needs a session secret. A random one per run is never committed
      # and never leaves the runner.
      - name: Provide a throwaway local secret for the preview Worker
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48)" > .dev.vars
      - run: npm run test:e2e
      # The GitHub reporter writes no HTML report; what a failure leaves behind
      # is the trace, screenshot and page snapshot under test-results/.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  sast:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    container:
      # Pinned by manifest digest so a moved tag cannot change the scanner.
      image: semgrep/semgrep:1.174.0@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Explicit rulesets: `--config auto` requires telemetry, which is off.
      - run: semgrep scan --config p/default --config p/typescript --config p/react --config p/secrets --error --metrics=off

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails the pull request when it introduces a dependency with a known
      # vulnerability of high severity or a licence outside the allow list.
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, OFL-1.1, MPL-2.0, CC0-1.0, Unlicense, BlueOak-1.0.0, Python-2.0, CC-BY-4.0
          comment-summary-in-pr: on-failure
