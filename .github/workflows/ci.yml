name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Tagged releases reuse these exact gates without receiving deployment secrets.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, so it needs more than the default shallow clone.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-gitleaks

      # Regenerates worker-configuration.d.ts and fails if the committed file
      # is stale, so wrangler.jsonc and the types can never drift apart.
      - uses: ./.github/actions/verify-worker-types

      # quality scans working/index/history plus bounded ZIP contents; build
      # separately scans every browser-served output. CI has no production secrets.
      - name: Format, lint, types, dead code, cycles, duplication, publication, audit, tests, build
        run: npm run quality:ci

      # The router plugin rewrites the route tree during the build above; the
      # committed copy must match so a fresh checkout lints and type-checks.
      - name: Verify the committed route tree is current
        run: git diff --exit-code -- src/client/routeTree.gen.ts

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  e2e-device:
    name: Playwright + axe (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [quality, sast]
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chrome, iphone, ipad, android]
    # Unique output names preserve one success receipt from every matrix child.
    # A missing/skipped child cannot be mistaken for a complete green matrix.
    outputs:
      desktop_chrome: ${{ steps.verify.outputs.desktop_chrome }}
      iphone: ${{ steps.verify.outputs.iphone }}
      ipad: ${{ steps.verify.outputs.ipad }}
      android: ${{ steps.verify.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-gitleaks
      # Every runner builds its own app and owns isolated temporary D1/R2 state.
      - name: Run every journey for this device
        id: verify
        shell: bash
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: |
          npm run test:e2e -- --project "$PLAYWRIGHT_PROJECT"
          printf '%s=success\n' "${PLAYWRIGHT_PROJECT//-/_}" >> "$GITHUB_OUTPUT"
      # The GitHub reporter writes no HTML report; what a failure leaves behind
      # is the trace, screenshot and page snapshot under test-results/.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  e2e:
    # Required branch-protection check: keep this name stable as shards change.
    name: End-to-end (Playwright + axe)
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [quality, sast, e2e-device]
    steps:
      - name: Require every device and prerequisite to succeed
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          MATRIX_RESULT: ${{ needs.e2e-device.result }}
          DESKTOP_RESULT: ${{ needs.e2e-device.outputs.desktop_chrome }}
          IPHONE_RESULT: ${{ needs.e2e-device.outputs.iphone }}
          IPAD_RESULT: ${{ needs.e2e-device.outputs.ipad }}
          ANDROID_RESULT: ${{ needs.e2e-device.outputs.android }}
        run: |
          for gate in QUALITY_RESULT SAST_RESULT MATRIX_RESULT DESKTOP_RESULT IPHONE_RESULT IPAD_RESULT ANDROID_RESULT; do
            if [[ "${!gate}" != success ]]; then
              printf '::error::%s did not succeed (%s). Every device is required.\n' "$gate" "${!gate}"
              exit 1
            fi
          done

  sast:
    name: Static analysis (semgrep)
    uses: ./.github/workflows/sast.yml

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails the pull request when it introduces a dependency with a known
      # vulnerability of high severity or a licence outside the allow list.
      - uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, OFL-1.1, MPL-2.0, CC0-1.0, Unlicense, BlueOak-1.0.0, Python-2.0, CC-BY-4.0
          # Findings remain in the check/job summary. Reusable tag callers stay read-only.
          comment-summary-in-pr: never
