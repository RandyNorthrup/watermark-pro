# Extends every default rule. The only value-based allowlist entries are the
# current and retired public Dropbox application identifiers used by its SDK.
# They do not grant access to a user's files without that user's OAuth consent.
# Google Picker keys are runtime configuration, never committed key values.
# A revoked historical Google key is tracked by an immutable fingerprint/digest;
# the publication gate never exempts working, staged or built credentials.
# See docs/verification/m19/picker-key-rotation.md and PLAN.md section9.
title = "Lumafoil"

[extend]
useDefault = true

[allowlist]
description = "Public Dropbox SDK application identifiers"
regexes = [
  '''s93kl2ruaou8f3p''',
  '''n4p4sfvxnat9ccd''',
]
