<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#26242f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Watermark" />
    <meta
      name="description"
      content="Watermark Pro: bulk photo watermarking with smart placement, a watermark library, an editor, and secure sharing."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Watermark Pro</title>
    <!--
      Resolve the stored theme before the first paint so the static skeleton
      below (and the app after it) never flashes the wrong colour. Mirrors
      src/client/lib/theme.ts (STORAGE_KEY, the system fallback). This inline
      script is hashed into script-src at build time by the
      inline-script-csp-hash plugin in vite.config.ts.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('watermark-pro.theme')
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolved
        } catch (error) {
          /* private mode blocks storage; the media query fallback in the skeleton CSS covers it */
        }
      })()
    </script>
    <style>
      /*
       * First-paint skeleton of the app frame. Painted from static HTML before
       * any JavaScript runs and replaced by React's first render (it lives
       * inside #root). Theme tokens are duplicated from src/client/styles/app.css
       * (--surface, --surface-raised, --line) so the skeleton matches the app;
       * the [data-theme] rule follows the inline script above and the media
       * query is the fallback when storage is blocked. Keep this small.
       */
      #wm-skeleton {
        --sk-surface: oklch(99% 0.004 285deg);
        --sk-raised: oklch(100% 0 0deg);
        --sk-line: oklch(90% 0.01 285deg);
        --sk-shimmer: oklch(94% 0.008 285deg);
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: var(--sk-surface);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      html[data-theme='dark'] #wm-skeleton {
        --sk-surface: oklch(16% 0.015 285deg);
        --sk-raised: oklch(21% 0.018 285deg);
        --sk-line: oklch(30% 0.015 285deg);
        --sk-shimmer: oklch(26% 0.02 285deg);
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) #wm-skeleton {
          --sk-surface: oklch(16% 0.015 285deg);
          --sk-raised: oklch(21% 0.018 285deg);
          --sk-line: oklch(30% 0.015 285deg);
          --sk-shimmer: oklch(26% 0.02 285deg);
        }
      }
      #wm-skeleton .wm-sk-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: max(0.75rem, env(safe-area-inset-top)) 1rem 0.75rem;
        border-bottom: 1px solid var(--sk-line);
        background: var(--sk-raised);
      }
      #wm-skeleton .wm-sk-brand {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }
      #wm-skeleton .wm-sk-brand svg {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 0.5rem;
      }
      #wm-skeleton .wm-sk-wordmark {
        width: 6.5rem;
        height: 0.9rem;
        border-radius: 0.35rem;
      }
      #wm-skeleton .wm-sk-controls {
        display: flex;
        gap: 0.5rem;
      }
      #wm-skeleton .wm-sk-dot {
        width: 2rem;
        height: 2rem;
        border-radius: 999px;
      }
      #wm-skeleton .wm-sk-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.5rem 1rem;
        max-width: 64rem;
        width: 100%;
        margin: 0 auto;
      }
      #wm-skeleton .wm-sk-block {
        height: 8rem;
        border-radius: 1rem;
        border: 1px solid var(--sk-line);
      }
      #wm-skeleton .wm-sk-block:first-child {
        height: 3rem;
        max-width: 18rem;
      }
      #wm-skeleton .wm-sk-tabbar {
        display: flex;
        justify-content: space-around;
        gap: 0.5rem;
        padding: 0.5rem 1rem calc(0.5rem + env(safe-area-inset-bottom));
        border-top: 1px solid var(--sk-line);
        background: var(--sk-raised);
      }
      #wm-skeleton .wm-sk-tab {
        width: 3rem;
        height: 2.25rem;
        border-radius: 0.5rem;
      }
      @media (min-width: 768px) {
        #wm-skeleton .wm-sk-tabbar {
          display: none;
        }
      }
      #wm-skeleton .wm-sk-shimmer {
        background: linear-gradient(
          100deg,
          var(--sk-raised) 30%,
          var(--sk-shimmer) 50%,
          var(--sk-raised) 70%
        );
        background-size: 200% 100%;
        animation: wm-sk-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes wm-sk-shimmer {
        from {
          background-position: 180% 0;
        }
        to {
          background-position: -80% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #wm-skeleton .wm-sk-shimmer {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="wm-skeleton" aria-hidden="true">
        <div class="wm-sk-header">
          <div class="wm-sk-brand">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="wm-sk-g" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#6366f1" />
                  <stop offset="1" stop-color="#a855f7" />
                </linearGradient>
              </defs>
              <rect width="64" height="64" rx="14" fill="url(#wm-sk-g)" />
              <path
                d="M14 20l8 24 10-18 10 18 8-24"
                fill="none"
                stroke="#fff"
                stroke-width="5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <div class="wm-sk-wordmark wm-sk-shimmer"></div>
          </div>
          <div class="wm-sk-controls">
            <div class="wm-sk-dot wm-sk-shimmer"></div>
            <div class="wm-sk-dot wm-sk-shimmer"></div>
            <div class="wm-sk-dot wm-sk-shimmer"></div>
          </div>
        </div>
        <div class="wm-sk-main">
          <div class="wm-sk-block wm-sk-shimmer"></div>
          <div class="wm-sk-block wm-sk-shimmer"></div>
          <div class="wm-sk-block wm-sk-shimmer"></div>
        </div>
        <div class="wm-sk-tabbar">
          <div class="wm-sk-tab wm-sk-shimmer"></div>
          <div class="wm-sk-tab wm-sk-shimmer"></div>
          <div class="wm-sk-tab wm-sk-shimmer"></div>
          <div class="wm-sk-tab wm-sk-shimmer"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
