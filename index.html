<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#211d21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lumafoil" />
    <meta
      name="description"
      content="Lumafoil: watermark photos, videos, and PDFs with reusable presets, offline editing, and optional cloud sharing. Access by invitation."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      as="fetch"
      href="/src/client/locales/en/common.json"
      crossorigin
      data-app-preload
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumafoil" />
    <meta property="og:title" content="Lumafoil — Watermark photos, videos, and PDFs" />
    <meta property="og:image" content="https://lumafoil.com/brand/social-wide.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Lumafoil</title>
    <!--
      Resolve the stored theme before the first paint so the static skeleton
      below (and the app after it) never flashes the wrong colour. Mirrors
      src/client/lib/theme.ts (STORAGE_KEY, the system fallback). This inline
      script is hashed into script-src at build time by the
      inline-script-csp-hash plugin in vite.config.ts.
    -->
    <script>
      {
        let stored
        try {
          stored = localStorage.getItem('watermark-pro.theme')
        } catch {}
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      }
    </script>
    <style>
      /*
       * First-paint skeleton of the app frame. Painted from static HTML before
       * any JavaScript runs and replaced by React's first render (it lives
       * inside #root). Theme tokens are duplicated from src/client/styles/app.css
       * (--surface, --surface-raised, --line) so the skeleton matches the app;
       * the [data-theme] rule follows the inline script above and the media
       * query is the fallback when storage is blocked. Keep this small.
       */
      #wm-skeleton {
        --sk-surface: #fbf9f7;
        --sk-raised: #fff;
        --sk-line: #e7dfe2;
        --sk-shimmer: #f3edeb;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: var(--sk-surface);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      html[data-theme='dark'] #wm-skeleton {
        --sk-surface: #191619;
        --sk-raised: #211d21;
        --sk-line: #43373e;
        --sk-shimmer: #322831;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) #wm-skeleton {
          --sk-surface: #191619;
          --sk-raised: #211d21;
          --sk-line: #43373e;
          --sk-shimmer: #322831;
        }
      }
      #wm-skeleton .wm-sk-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: max(0.75rem, env(safe-area-inset-top)) 1rem 0.75rem;
        border-bottom: 1px solid var(--sk-line);
        background: var(--sk-raised);
      }
      #wm-skeleton .wm-sk-brand {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }
      #wm-skeleton .wm-sk-brand svg {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 0.5rem;
      }
      #wm-skeleton .wm-sk-wordmark {
        width: 6.5rem;
        height: 0.9rem;
        border-radius: 0.35rem;
      }
      #wm-skeleton .wm-sk-controls {
        display: flex;
        gap: 0.5rem;
      }
      #wm-skeleton .wm-sk-dot {
        width: 2rem;
        height: 2rem;
        border-radius: 999px;
      }
      #wm-skeleton .wm-sk-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.5rem 1rem;
        max-width: 64rem;
        width: 100%;
        margin: 0 auto;
      }
      #wm-skeleton .wm-sk-block {
        height: 8rem;
        border-radius: 1rem;
        border: 1px solid var(--sk-line);
      }
      #wm-skeleton .wm-sk-block:first-child {
        height: 3rem;
        max-width: 18rem;
      }
      #wm-skeleton .wm-sk-tabbar {
        display: flex;
        justify-content: space-around;
        gap: 0.5rem;
        padding: 0.5rem 1rem calc(0.5rem + env(safe-area-inset-bottom));
        border-top: 1px solid var(--sk-line);
        background: var(--sk-raised);
      }
      #wm-skeleton .wm-sk-tab {
        width: 3rem;
        height: 2.25rem;
        border-radius: 0.5rem;
      }
      @media (min-width: 768px) {
        #wm-skeleton .wm-sk-tabbar {
          display: none;
        }
      }
      #wm-skeleton .wm-sk-shimmer {
        background: linear-gradient(
          100deg,
          var(--sk-raised) 30%,
          var(--sk-shimmer) 50%,
          var(--sk-raised) 70%
        );
        background-size: 200% 100%;
        animation: wm-sk-shimmer 1.4s ease-in-out infinite;
      }
      @keyframes wm-sk-shimmer {
        from {
          background-position: 180% 0;
        }
        to {
          background-position: -80% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #wm-skeleton .wm-sk-shimmer {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="wm-skeleton" aria-hidden="true">
        <div class="wm-sk-header">
          <div class="wm-sk-brand">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="wm-sk-g" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#c86b82" />
                  <stop offset="1" stop-color="#a94965" />
                </linearGradient>
              </defs>
              <rect width="64" height="64" rx="21.333" fill="url(#wm-sk-g)" />
              <path
                d="M7 5v14h11M12 5h6M12 10h4"
                transform="translate(14.222 14.222) scale(1.48148)"
                fill="none"
                stroke="#fff"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <div class="wm-sk-wordmark wm-sk-shimmer"></div>
          </div>
          <div class="wm-sk-controls">
            <div class="wm-sk-dot wm-sk-shimmer"></div>
            <div class="wm-sk-dot wm-sk-shimmer"></div>
            <div class="wm-sk-dot wm-sk-shimmer"></div>
          </div>
        </div>
        <div class="wm-sk-main">
          <div class="wm-sk-block wm-sk-shimmer"></div>
          <div class="wm-sk-block wm-sk-shimmer"></div>
          <div class="wm-sk-block wm-sk-shimmer"></div>
        </div>
        <div class="wm-sk-tabbar">
          <div class="wm-sk-tab wm-sk-shimmer"></div>
          <div class="wm-sk-tab wm-sk-shimmer"></div>
          <div class="wm-sk-tab wm-sk-shimmer"></div>
          <div class="wm-sk-tab wm-sk-shimmer"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
